 else if(t.id==="addph"||t.id==="camph"){const cur=S.full[S.user.uid]||[];const fs=[...t.files].slice(0,6-cur.length);if(!fs.length)return;toast("Uploading...");try{const add=[];for(const f of fs)add.push(await prepPhoto(f));const ps=[...cur,...add].slice(0,6);await setDoc(doc(db,"photos",S.user.uid),{ps,at:Date.now()});await updateDoc(doc(db,"models",S.user.uid),{p:await thumbOf(ps[0])});toast("Photos added");await load();render()}catch(err){console.error(err);S.err="Could not upload photos.";render()}}
});
const hm=location.hash.match(/^#t=([\w-]+)/);if(hm){S.tp=hm[1];S.pendTp=hm[1]}
if("serviceWorker" in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
if(!CONFIGURED)S.err="Setup pending: Firebase keys missing in config.js.";
render();setTimeout(()=>{if(!S.started){S.started=true;render()}},6000);
</script></body></html>
