<script type="module">

const TXTBAD=/([0-9][^a-z0-9]{0,2}){3}[0-9]|https?:|www[.]|[.](com|in|me|net|org|co)([^a-z]|$)|@|₹|\$/i;

let _app=APPMODE;try{if(_app)localStorage.setItem("wgApp","1");else _app=localStorage.getItem("wgApp")==="1"&&!!localStorage.getItem("wgWant")}catch(_){}
const SAMEDOM=_app&&!IOS&&location.hostname==="unitedmodelsindia-afk.github.io";
let auth,db;if(CONFIGURED){try{const a=initializeApp(SAMEDOM?{...cfg,authDomain:location.hostname}:cfg);auth=getAuth(a);try{db=initializeFirestore(a,{localCache:persistentLocalCache({tabManager:persistentMultipleTabManager()})})}catch(_){db=getFirestore(a)}}catch(e){console.error(e)}}
let S={role:"",brand:null,note:"",lang:"en",aq:"",pq:"",pmap:{},notes:{},logs:[],reports:[],v:"home",user:null,err:"",list:[],mine:null,priv:{},bk:[],posts:[],reqs:[],sug:{},likes:[],busy:[],busyMap:{},likesMap:{},tiers:{x:"",y:"",z:""},mgr:false,mgrs:[],full:{},seen:{},pn:12,autosize:true,isb:false,bmap:{},g:"",photos:[],rate:{},rv:[],loading:false,sheet:false,started:false,msgs:[],match:null,at:"talent",brands:[],newph:[],cs:null,gs:null,cts:[]};
const resetS=()=>{Object.assign(S,{mgr:false,mgrs:[],full:{},seen:{},pn:12,role:"",brand:null,note:"",bk:[],posts:[],reqs:[],list:[],sug:{},likes:[],busy:[],busyMap:{},likesMap:{},mine:null,priv:{},rate:{},rv:[],photos:[],g:"",match:null,sheet:false,isb:false,bmap:{},brands:[],newph:[],cs:null,gs:null,cts:[]})};
const logA=(act,ref)=>addDoc(collection(db,"logs"),{act,ref:String(ref||""),at:Date.now()}).catch(()=>{});

async function load(){
 try{
  if(S.user&&S.v!=="admin"){try{S.isb=(await getDoc(doc(db,"blocked",S.user.uid))).exists()}catch(_){S.isb=false}}
  const cq=(c,f)=>getDocs(query(collection(db,c),where(f,"==",S.user.uid))).then(x=>x.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>b.at-a.at));
  const all=c=>getDocs(collection(db,c)).then(x=>x.docs.map(d=>({id:d.id,...d.data()})));
  if(S.v==="admin"){
   const M=S.mgr;
   const c=await getDoc(doc(db,"settings","config"));S.autosize=c.exists()?c.data().auto!==false:true;
   S.bmap={};if(!M)(await all("blocked")).forEach(x=>S.bmap[x.id]=true);
   S.pmap={};(await all("posts")).forEach(x=>S.pmap[x.id]=x);S.notes={};if(!M)(await all("notes")).forEach(x=>S.notes[x.id]=x.text);S.reports=(await all("reports")).sort((a,b)=>b.at-a.at);S.logs=M?[]:(await all("logs")).sort((a,b)=>b.at-a.at).slice(0,15);
   if(!M){const t=await getDoc(doc(db,"settings","tiers"));if(t.exists())S.tiers=t.data();S.mgrs=(await all("managers")).map(x=>x.id).sort()}
   const s=await getDocs(collection(db,"models"));S.list=await Promise.all(s.docs.map(async d=>{let pr={};if(!M){const p=await getDoc(doc(db,"private",d.id));pr=p.exists()?p.data():{}}return{...d.data(),uid:d.data().uid||d.id,priv:pr}}));
   S.list.sort((a,b)=>(b.at||0)-(a.at||0));S.brands=(await all("brands")).sort((a,b)=>(b.at||0)-(a.at||0));
   S.bk=(await all("bookings")).sort((a,b)=>b.at-a.at);try{S.chats=(await all("chats")).sort((a,b)=>(b.at||0)-(a.at||0))}catch(_){S.chats=[]}S.reqs=(await all("requirements")).sort((a,b)=>b.at-a.at);S.sug={};try{(await all("suggestions")).forEach(x=>S.sug[x.rid]=x.mids||[])}catch(_){}
  }else if(["req","prof","mybook"].includes(S.v)){
   const b=await getDoc(doc(db,"brands",S.user.uid));S.brand=b.exists()?b.data():null;if(!S.brand){S.v="brandprofile";return}
   S.list=(await getDocs(query(collection(db,"models"),where("v","==",true)))).docs.map(d=>d.data());
   S.list.sort((a,b)=>(b.at||0)-(a.at||0));
   S.reqs=await cq("requirements","cid");S.bk=await cq("bookings","cid");try{S.chats=await cq("chats","cid")}catch(_){S.chats=[]}
   S.sug={};(await cq("suggestions","cid")).forEach(x=>S.sug[x.rid]=x.mids||[]);
   const l=await getDoc(doc(db,"likes",S.user.uid));S.likes=l.exists()?l.data().mids||[]:[]
  }else if(S.v==="chats"){
   const q=S.mgr||isAdmin(S.user)?collection(db,"chats"):query(collection(db,"chats"),where(S.role==="client"?"cid":"mid","==",S.user.uid));
   S.chats=(await getDocs(q)).docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(b.at||0)-(a.at||0));
  }else if(S.v==="tp"){
   const d=await getDoc(doc(db,"models",S.tp));S.tpm=d.exists()?{...d.data(),uid:S.tp}:null;
   try{const ph=await getDoc(doc(db,"photos",S.tp));S.full[S.tp]=ph.exists()?ph.data().ps||[]:[]}catch(_){S.full[S.tp]=[]}
  }else if(S.v==="model"){
   const d=await getDoc(doc(db,"models",S.user.uid));S.mine=d.exists()?d.data():null;
   if(S.mine){try{const ph=await getDoc(doc(db,"photos",S.user.uid));S.full[S.user.uid]=ph.exists()?ph.data().ps||[]:[]}catch(_){}const p=await getDoc(doc(db,"private",S.user.uid));S.priv=p.exists()?p.data():{};S.posts=await cq("posts","mid");try{S.bk=await cq("bookings","mid")}catch(_){S.bk=[]}try{S.chats=await cq("chats","mid")}catch(_){S.chats=[]}
    const b=await getDoc(doc(db,"busy",S.user.uid));S.busy=b.exists()?b.data().dates||[]:[]}}
 }catch(e){console.error(e);S.err="Could not load data."}
}
async function go(v){S.v=v;S.err="";render();await load();render()}
const getRole=async uid=>{try{const d=await getDoc(doc(db,"users",uid));return d.exists()?d.data().role:""}catch(_){return""}};
const loginErr=e=>e&&e.code==="auth/unauthorized-domain"?"Login blocked: add this website domain in Firebase > Authentication > Settings > Authorized domains.":e&&e.code==="auth/popup-closed-by-user"?"Login cancelled.":"Login failed ("+((e&&e.code)||"error")+"). Please try again.";
async function afterLogin(u,want){S.user=u;
  if(want==="admin"){if(isAdmin(u)){S.mgr=false;return await go("admin")}if(await isMgr(u)){S.mgr=true;return await go("admin")}await signOut(auth);S.user=null;S.err="Not an admin: "+(u.email||"")+" is not on the admin list.";S.v="home";return render()}
  const want2=want==="client"?"client":"model";let r=await getRole(u.uid);
  if(!r){await setDoc(doc(db,"users",u.uid),{role:want2,at:Date.now()});r=want2}
  S.role=r;if(S.tp&&location.hash.startsWith("#t=")){S.back=r==="client"?"prof":"model";return await go("tp")}await go(r==="client"?"req":"model")}
async function viaRedirect(want){try{localStorage.setItem("wgWant",want)}catch(_){}await signInWithRedirect(auth,new GoogleAuthProvider().setCustomParameters({prompt:"select_account"}))}
async function login(want){
 S.err="";resetS();
 if(!auth){S.err="App setup incomplete: add Firebase keys in config.js.";S.v="home";return render()}
 if(SAMEDOM)return viaRedirect(want);
 toast("Google login khul raha hai...");try{const u=(await signInWithPopup(auth,new GoogleAuthProvider().setCustomParameters({prompt:"select_account"}))).user;await afterLogin(u,want)}
 catch(e){console.error(e);S.err=loginErr(e);S.v="home";render()}
}
if(auth){getRedirectResult(auth).then(async r=>{let w="";try{w=localStorage.getItem("wgWant")||"";localStorage.removeItem("wgWant")}catch(_){}const u=(r&&r.user)||(w&&auth.currentUser);if(u)await afterLogin(u,w||"model")}).catch(e=>{console.error(e);try{localStorage.removeItem("wgWant")}catch(_){}S.err=loginErr(e);S.v="home";render()})}

if(auth){
  onAuthStateChanged(auth, async u => {
    S.user = u;
    let pend=""; try{pend=localStorage.getItem("wgWant")||""}catch(_){}

    } else { if (S.v !== "home") { S.v = "home"; render(); } }
    if (!S.started) { S.started = true; render(); }
  });
}

function vidEmbed(u){let m;
 if(m=u.match(/(?:youtube\.com\/(?:watch\?v=|shorts\/|embed\/)|youtu\.be\/)([\w-]{6,})/))return`<iframe src="https://www.youtube-nocookie.com/embed/${m[1]}" allow="encrypted-media;picture-in-picture" allowfullscreen loading="lazy"></iframe>`;
 if(m=u.match(/instagram\.com\/(?:reel|reels|p|tv)\/([\w-]+)/))return`<iframe src="https://www.instagram.com/reel/${m[1]}/embed" loading="lazy" allowfullscreen style="aspect-ratio:9/16"></iframe>`;
 if(m=u.match(/drive\.google\.com\/file\/d\/([\w-]+)/))return`<iframe src="https://drive.google.com/file/d/${m[1]}/preview" allow="autoplay" allowfullscreen loading="lazy"></iframe>`;
 return`<a class="btn ghost" href="${esc(u)}" target="_blank" rel="noopener">Watch video</a>`}

async function thumbOf(dataUrl){const img=new Image();return new Promise(res=>{img.onload=()=>res(autoSizePhoto(img,240,300,.7));img.onerror=()=>res("");img.src=dataUrl})}
function autoSizePhoto(i,targetW=600,targetH=750,q=.78){
 const c=document.createElement("canvas");c.width=targetW;c.height=targetH;
 const ctx=c.getContext("2d");ctx.fillStyle="#160f09";ctx.fillRect(0,0,targetW,targetH);
 const cs=Math.max(targetW/i.width,targetH/i.height);ctx.save();ctx.filter="blur(18px) brightness(.55)";ctx.drawImage(i,(targetW-i.width*cs)/2,(targetH-i.height*cs)/2,i.width*cs,i.height*cs);ctx.restore();ctx.filter="none";ctx.fillStyle="rgba(10,6,3,.35)";ctx.fillRect(0,0,targetW,targetH);
 const fs=Math.min(targetW/i.width,targetH/i.height),fw=i.width*fs,fh=i.height*fs;
 ctx.drawImage(i,(targetW-fw)/2,(targetH-fh)/2,fw,fh);
 return c.toDataURL("image/jpeg",q);
}
const prepPhoto=async f=>{const img=new Image();const u=URL.createObjectURL(f);return new Promise(res=>{img.onload=()=>{URL.revokeObjectURL(u);res(autoSizePhoto(img))};img.src=u})}
